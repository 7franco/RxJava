<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear tu CV</title>

    <link rel="stylesheet" th:href="@{/css/form-style.css}">
</head>
<body>
    <h1>Crea o Edita tu CV</h1>
    <form th:object="${cvData}" method="post" th:action="@{/generate-cv}">
        <h2>Detalles Personales</h2>
        <div>
            <label for="firstName">Nombre:</label>
            <input type="text" id="firstName" th:field="*{personalDetails.firstName}" />
        </div>

        <div>
            <label for="lastName">Apellido:</label>
            <input type="text" id="lastName" th:field="*{personalDetails.lastName}" />
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" value="gabriel@example.com" />
        </div>
        <div>
            <label for="phone">Teléfono:</label>
            <input type="text" id="phone" value="123-456-7890" />
        </div>
        <div>
            <label for="address">Dirección:</label>
            <input type="text" id="address" value="Calle Falsa 123" />
        </div>
        <div>
            <label for="city">Ciudad:</label>
            <input type="text" id="city" value="Mar del Plata" />
        </div>
        <div>
            <label for="province">Provincia:</label>
            <input type="text" id="province" value="Buenos Aires" />
        </div>
        <div>
            <label for="postalCode">Código Postal:</label>
            <input type="text" id="postalCode" value="7600" />
        </div>
        <div>
            <label for="professionalProfile">Perfil Profesional:</label>
            <textarea id="professionalProfile" rows="5">Desarrollador Full Stack con experiencia en Spring Boot y Angular.</textarea>
        </div>

        <hr/>

        <h2>Educación</h2>
        <h3>Educación 1</h3>
        <div>
            <label>Institución:</label>
            <input type="text" value="UTN - FRMDP" />
        </div>
        <div>
            <label>Título:</label>
            <input type="text" value="Ingeniería en Sistemas" />
        </div>
        <div>
            <label>Período:</label>
            <input type="text" value="2010 - 2016" />
        </div>
        <div>
            <label>Descripción:</label>
            <textarea rows="3">Formación sólida en programación, redes y bases de datos.</textarea>
        </div>

        <hr/>

        <h2>Experiencia</h2>
        <h3>Experiencia 1</h3>
        <div>
            <label>Puesto:</label>
            <input type="text" value="Docente Universitario" />
        </div>
        <div>
            <label>Empresa:</label>
            <input type="text" value="UTN Mar del Plata" />
        </div>
        <div>
            <label>Período:</label>
            <input type="text" value="2018 - Actualidad" />
        </div>
        <div>
            <label>Descripción:</label>
            <textarea rows="3">Profesor en cursos de programación y desarrollo web.</textarea>
        </div>

        <hr/>

        <h2>Habilidades</h2>
        <h3>Habilidad 1</h3>
        <div>
            <label>Nombre:</label>
            <input type="text" value="Java" />
        </div>
        <div>
            <label>Nivel:</label>
            <input type="text" value="Avanzado" />
        </div>

        <br/>
        <button type="submit">Generar/Actualizar CV</button>


    </form>
</body>
</html>
